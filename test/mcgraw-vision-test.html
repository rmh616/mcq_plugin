<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>McGraw Hill sibling histogram</title>
<style>
body{font:14px/1.5 sans-serif;margin:24px}label{display:block}
awd-probe,avalon-probe-renderer,avalon-image-renderer,awd-navigation-bar,awd-confidence-buttons{display:block}
.prompt-image{width:524px;height:auto}._visuallyHidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pass{color:green}.fail{color:red}
</style>
<div id="verdict">Running</div><pre id="out"></pre><main id="page"></main>
<!-- Loading the original asset before tests avoids decode/virtual-time races. -->
<iframe id="source" src="./mcgraw-vision-fixture.html" style="display:none"></iframe>
<script>
const listeners=[],requests=[],settings={apiKey:'fake',mode:'select',actionDelay:5,submitDelay:5,pageTimeout:1800,maxRounds:1};
let submits=0,nextClicks=0;
window.chrome={storage:{local:{get:async()=>({mcqSettings:settings})}},runtime:{onMessage:{addListener:fn=>listeners.push(fn)},sendMessage(msg,cb){
  let result={ok:true};
  if(msg.type==='MCQ_SOLVE'){
    requests.push(msg.payload);
    result=msg.payload.images?.[0]?.dataUrl?{ok:true,letters:['B'],confidence:0.95,reason:'local vision stub'}:{ok:false,error:'Histogram missing'};
  }
  if(cb)cb(result);return Promise.resolve(result);
}}};
const send=type=>new Promise(resolve=>listeners[0]({type},{},resolve));
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function run(){await send('MCQ_START');await sleep(30);for(let i=0;i<120&&__MCQ_DEBUG__.state.running;i++)await sleep(100);}
</script><script src="../content/detector.js"></script><script src="../content/vision.js"></script><script src="../content/solver.js"></script>
<script>
window.addEventListener('load',async()=>{
 const checks=[],check=(name,ok)=>checks.push([name,!!ok]),D=__MCQ_DETECTOR__,debug=__MCQ_DEBUG__,page=document.getElementById('page');
 try{
  const frame=document.getElementById('source');
  page.append(...Array.from(frame.contentDocument.body.childNodes));frame.remove();
  const original=page.innerHTML,chart=page.querySelector('.prompt-image');
  if (!chart.complete || !chart.naturalWidth) await new Promise((resolve,reject)=>{
    chart.onload=resolve;chart.onerror=()=>reject(new Error('Original histogram JPEG did not load'));
  });
  check('原附件JPEG已加载',chart.complete&&chart.naturalWidth>0);
  let q=D.collect()[0];
  check('实际附件四选项与题干完整',D.collect().length===1&&q.type==='single'&&q.options.map(o=>o.text).join('|')==='$600|$200|$3400|$1800'&&q.stem==='In the histogram shown, the minimum profit was at least what amount?');
  check('左侧图表在选项容器之外',!q.container.contains(chart));
  check('图表关联到当前题目',q.visuals.length===1&&q.visuals[0].element===chart&&q.visuals[0].label==='Question image');
  const hash=q.hash;
  const encoded=await __MAS_VISION__.prepare(q);
  check('实际直方图转为PNG字节',encoded.length===1&&encoded[0].dataUrl?.startsWith('data:image/png;base64,')&&encoded[0].dataUrl.length>1000);
  await send('MCQ_SCAN');
  check('扫描不提前调用模型',requests.length===0);
  await run();
  check('模型请求包含直方图字节与题干',requests.length===1&&requests[0].images?.[0]?.dataUrl?.length>1000&&requests[0].images[0].dataUrl===encoded[0]?.dataUrl&&requests[0].stem===q.stem);
  check('模型B映射到实际$200选项',page.querySelectorAll('input:checked').length===1&&q.options[1].input.checked&&submits===0);

  const renderer=chart.closest('avalon-probe-renderer');
  page.insertAdjacentHTML('afterbegin','<header><img src="./vision-assets/mcgraw-profit-histogram.jpeg" width="40" height="20"></header>');
  renderer.insertAdjacentHTML('beforeend','<aside><img src="./vision-assets/mcgraw-profit-histogram.jpeg" width="40" height="20"></aside><awd-readspeaker-widget><svg width="20" height="20"><path d="M0 0 L20 20"/></svg></awd-readspeaker-widget>');
  const imageRenderer=chart.closest('avalon-image-renderer');
  imageRenderer.insertAdjacentHTML('beforeend','<img hidden src="./vision-assets/mcgraw-profit-histogram.jpeg"><div aria-hidden="true"><img src="./vision-assets/mcgraw-profit-histogram.jpeg" width="20" height="20"></div>');
  q=D.collect()[0];
  check('不采集页眉侧栏朗读图标或隐藏图片',q.visuals.length===1&&q.visuals[0].element===chart);
  const savedSrc=chart.getAttribute('src');chart.src=savedSrc+'?changed';
  check('左侧图表变化使题目hash变化',D.collect()[0].hash!==hash);
  chart.src=savedSrc;
  check('选中状态和无关图片不改变hash',D.collect()[0].hash===hash);

  // Options may also contain images, each must keep its own letter association.
  const icon=document.createElement('canvas');icon.width=20;icon.height=20;icon.getContext('2d').fillRect(0,0,20,20);
  q.options[0].clickTarget.insertAdjacentHTML('beforeend','<img src="'+icon.toDataURL()+'" width="20" height="20">');
  q=D.collect()[0];
  check('选项图片保留Option A标签',q.visuals.length===2&&q.visuals.some(v=>v.label==='Option A image'&&q.options[0].clickTarget.contains(v.element)));

  // A second independent probe must not contribute its image to the first one.
  const second=document.createElement('section');second.innerHTML=original;
  second.querySelectorAll('input').forEach(el=>{el.name+='-second';});
  second.querySelector('.prompt').textContent='A separate question with its own graph.';
  page.append(second);
  const qs=D.collect();
  check('同页两个probe各自关联图片',qs.length===2&&qs[0].visuals.length===2&&qs[1].visuals.length===1&&qs[1].visuals[0].element===second.querySelector('.prompt-image'));
  second.remove();

  // Broken graph stays part of the question, so it cannot silently become text-only.
  page.innerHTML=original;debug.state.done.clear();settings.mode='submit';
  const broken=page.querySelector('.prompt-image');broken.src='data:image/png;base64,invalid';broken.width=524;broken.height=220;
  const before=requests.length;
  page.querySelectorAll('.btn-confidence').forEach(el=>{el.disabled=false;el.onclick=()=>submits++;});
  await run();
  check('图表损坏时明确失败且不发纯文字请求',requests.length===before&&submits===0&&debug.state.stats.failed===1);
  check('图表损坏时不选择任何答案',page.querySelectorAll('input:checked').length===0);

  // Fresh DOM, same actual JPEG: reuse encoded bytes through full submit/Next flow.
  page.innerHTML=original;debug.state.done.clear();
  page.querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>page.querySelectorAll('.btn-confidence').forEach(btn=>{btn.disabled=false;})));
  page.querySelector('[data-automation-id="confidence-buttons--medium_confidence"]').onclick=()=>{
    submits++;page.querySelector('awd-probe').innerHTML='<h2>Your Answer: correct</h2>';
    page.querySelector('.confidence-buttons-container').remove();
    page.querySelector('awd-question-button-bar .navigation-row').insertAdjacentHTML('afterbegin','<button id="next">Next Question</button>');
    page.querySelector('#next').onclick=()=>{
      nextClicks++;page.innerHTML='<fieldset><p>A newly loaded question after histogram feedback.</p><label><input type="radio" name="new">Yes</label><label><input type="radio" name="new">No</label></fieldset>';
    };
  };
  await run();
  check('图表题完成选择、Medium提交和Next翻页',submits===1&&nextClicks===1&&D.collect()[0]?.stem==='A newly loaded question after histogram feedback.');
  check('图表题推进不等满超时',debug.state.stats.timeouts===0);
 }catch(error){check('无测试异常: '+error.stack,false);debug.state.running=false;}
 document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
 document.getElementById('out').textContent=JSON.stringify({checks,requests:requests.map(q=>({stem:q.stem,images:q.images?.length})),submits,nextClicks},null,2);
 window.__TEST_DONE__=true;
});
</script></html>
