<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Canvas Review Questions compatibility</title>
<style>body {font:14px/1.5 sans-serif;margin:24px} .question {border:1px solid #ddd;margin:10px;padding:10px} label {display:block} .pass {color:green} .fail {color:red}</style>
<div id="verdict">运行中…</div><pre id="out"></pre><form id="quiz_form"><div id="page"></div><button type="submit">Submit Quiz</button></form>
<script>
const listeners = [], requests = [];
let submits = 0;
const settings = { apiKey:'fake', mode:'submit', actionDelay:10, submitDelay:10, concurrency:3, pageTimeout:1500 };
window.chrome = {
  runtime: {
    onMessage: { addListener: fn => listeners.push(fn) },
    sendMessage(msg, callback) {
      let reply = { ok:true };
      if (msg.type === 'MCQ_SOLVE') {
        requests.push(msg.payload);
        reply = { ok:true, letters:[msg.payload.options[0].letter], confidence:1, reason:'local test' };
      }
      if (callback) callback(reply);
      return Promise.resolve(reply);
    }
  },
  storage: { local: { get:async () => ({ mcqSettings:settings }) } }
};
const send = type => new Promise(resolve => listeners[0]({type}, {}, resolve));
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
document.getElementById('quiz_form').onsubmit = event => { event.preventDefault(); submits++; };
</script>
<script src="../content/detector.js"></script><script src="../content/solver.js"></script>
<script>
(async () => {
  const checks = [], check = (name, ok) => checks.push([name, !!ok]);
  const D = window.__MCQ_DETECTOR__, debug = window.__MCQ_DEBUG__, page = document.getElementById('page');
  try {
    page.innerHTML = await (await fetch('./canvas-review-fixture.html')).text();
    const qs = D.collect(document, {includeReadOnly:true});
    check('新附件16道题全部识别', qs.length === 16);
    check('第1题实际多选控件和四组术语/定义被保留', qs[0].type === 'multi' && qs[0].options.length === 4 && qs[0].stem.includes('Match each term') && qs[0].stem.includes('The next-best thing') && qs[0].options[0].text === 'opportunity cost');
    check('第2题小写六个选项均展开', qs[1].type === 'multi' && qs[1].options.length === 6 && qs[1].options[0].text.startsWith('The unemployment rate'));
    check('跨行选项内容保留完整', qs[1].options[1].text.endsWith('India.') && qs[1].options[5].text.endsWith('2018.'));
    check('第3题映射increase/decrease并标记两颗空按钮', qs[2].options[0].text === 'increase' && qs[2].options[1].text === 'decrease' && qs[2].options.slice(2).every(o => o.unavailable) && !qs[2].incomplete);
    check('第4、5题明确报告源网页缺失', qs[3].incomplete && qs[4].incomplete && qs[3].options.every(o => o.unavailable) && qs[4].options.every(o => o.unavailable));
    check('缺失对应关系时仍保留题干里的a/b文字', qs[3].stem.includes('a. increase') && qs[3].stem.includes('b. decrease') && qs[4].stem.includes('a. increase'));
    check('第6题小写题干对应大写控件', qs[5].options.map(o => o.text).join('|') === '10 pens.|5 pens.|zero pens.|4 pens.');
    check('第7–15题三选项完整且空按钮不参与作答', qs.slice(6,15).every(q => !q.incomplete && q.options.filter(o => !o.unavailable).length === 3 && q.options.filter(o => !o.unavailable).every(o => o.text.length > 1)));
    check('第10题前置空按钮不导致选项错位', qs[9].options[0].unavailable && qs[9].options[1].letter === 'B' && qs[9].options[1].text === 'more,' && qs[9].options[1].input.id === 'answer-3412');
    check('第16题完整选项展开', qs[15].options[2].text === 'Increases in resource supplies and advances in technology.');
    const scan = await send('MCQ_SCAN');
    const rows = [...document.getElementById('__mcq_panel_host').shadowRoot.querySelectorAll('.row')];
    check('扫描展示全部16题及缺失提示', scan.count === 16 && rows[3].querySelector('.pick').textContent === '缺失' && rows[4].querySelector('.why').textContent.includes('网页未提供'));
    check('扫描显示空占位而非伪造的答案', rows[9].querySelector('.why').textContent.includes('A. [空选项') && rows[9].querySelector('.why').textContent.includes('B. more,'));
    check('仅有第4、5题无法完成文本映射', qs.filter(q => q.incomplete).length === 2);
    page.querySelectorAll('input').forEach(el => { el.disabled=false; el.removeAttribute('aria-disabled'); el.checked=false; });
    check('可编辑副本与只读扫描hash一致', D.collect().every((q,i) => q.hash === qs[i].hash));
    await send('MCQ_START'); await sleep(30);
    for(let n=0;n<100 && debug.state.running;n++) await sleep(100);
    check('仅14道文字完整题目进入模型', requests.length === 14 && !requests.some(p => p.hash === qs[3].hash || p.hash === qs[4].hash));
    check('模型候选不包含空占位按钮', requests.every(p => p.options.every(o => !/No answer text provided/i.test(o.text))));
    const p10 = requests.find(p => p.hash === qs[9].hash);
    check('第10题模型标签B回点原始第二颗radio', p10.options[0].letter === 'B' && qs[9].options[1].input.checked && !qs[9].options[0].input.checked);
    check('两道缺失题使整页停止而非提交不完整页面', submits === 0 && !debug.state.running && debug.state.stats.failed === 2 && debug.state.stats.answered === 14);
  } catch(error) { check('无测试异常: ' + error.message, false); }
  document.getElementById('verdict').innerHTML = checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
  document.getElementById('out').textContent = JSON.stringify({checks, apiCalls:requests.length, submits, stats:debug.state.stats},null,2);
  window.__TEST_DONE__=true;
})();
</script></html>
