<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>McGraw Hill feedback navigation</title>
<style>
body {font:14px/1.5 sans-serif;margin:24px} label {display:block}
awd-probe, awd-navigation-bar, awd-question-button-bar, awd-confidence-buttons {display:block}
._visuallyHidden {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pass {color:green} .fail {color:red}
</style>
<div id="verdict">运行中…</div><pre id="out"></pre><main id="page"></main>
<script>
const listeners=[], requests=[], clicks=[];
const settings={apiKey:'fake',mode:'submit',actionDelay:5,submitDelay:5,pageTimeout:1800,maxRounds:1};
window.chrome={
  runtime:{onMessage:{addListener:fn=>listeners.push(fn)},sendMessage(msg,cb){
    let result={ok:true};
    if(msg.type==='MCQ_SOLVE'){
      requests.push(msg.payload);
      result={ok:true,letters:['A','B','D'],confidence:0.9};
    }
    if(cb)cb(result);return Promise.resolve(result);
  }},
  storage:{local:{get:async()=>({mcqSettings:settings})}}
};
const send=type=>new Promise(resolve=>listeners[0]({type},{},resolve));
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
</script>
<script src="../content/detector.js"></script><script src="../content/solver.js"></script>
<script>
(async()=>{
  const checks=[], check=(name,ok)=>checks.push([name,!!ok]);
  const D=window.__MCQ_DETECTOR__, debug=window.__MCQ_DEBUG__, page=document.getElementById('page');
  try{
    const fixture=await(await fetch('./mcgraw-confidence-fixture.html')).text();
    const nextQuestion=()=>{
      page.innerHTML='<fieldset><p>A new question reached through Next Question.</p><label><input type="radio" name="new">Yes</label><label><input type="radio" name="new">No</label></fieldset>';
    };
    // Feedback content/button text follow the screenshot. The enclosing navigation
    // components and role come from the previously supplied Question Mode HTML.
    const renderFeedback=()=>{
      page.innerHTML=fixture;
      page.querySelector('awd-probe').innerHTML='<h2>Your Answer: correct</h2><p>Which level of data gives the most information about the observation?</p><p>Correct Answer: Ratio</p>';
      page.querySelector('.confidence-buttons-container').remove();
      page.querySelector('.navigation-row').insertAdjacentHTML('afterbegin','<div><button id="nextQuestion">Next Question</button></div>');
      page.insertAdjacentHTML('afterbegin','<header><button id="headerNext">Next Question</button><button>Exit Assignment</button></header>');
      page.querySelector('#headerNext').onclick=()=>clicks.push('wrong-header');
      const next=page.querySelector('#nextQuestion');
      next.onclick=()=>{clicks.push('next');nextQuestion();};
      return next;
    };
    let next=renderFeedback();
    check('反馈页没有可作答的新题',D.collect().length===0);
    check('无锚点时优先真正的题目页脚按钮',debug.findAdvanceButton(null)?.el===next);
    check('排除导航干扰时仍识别底部 Next Question',debug.findAdvanceButton(null,{excludeChrome:true})?.el===next);
    check('Next Question 不作为 Get Started',!debug.findAdvanceButton(null,{onlyStart:true}));
    await send('MCQ_SCAN');
    check('扫描结果显示 Next Question',document.getElementById('__mcq_panel_host').shadowRoot.querySelector('.meta').textContent.includes('Next Question'));
    next.disabled=true;
    check('禁用 Next 仍可定位并等待',debug.findAdvanceButton(null,{excludeChrome:true})?.el===next && debug.isDisabled(next));
    debug.state.running=true;
    setTimeout(()=>{next.disabled=false;},450);
    let result=await debug.advance(null);debug.state.running=false;
    check('从已停下的反馈页推进到新题',result.ok && result.questions?.length===1 && clicks.join(',')==='next');

    page.innerHTML='<footer><button>Next Question</button></footer><nav><button>Next Question</button></nav>';
    check('其它网站导航区同名按钮仍被排除',!debug.findAdvanceButton(null,{excludeChrome:true}));
    page.innerHTML='<awd-navigation-bar><div role="navigation"><awd-question-button-bar><button>Reading</button><button>Previous Question</button><button>Exit Assignment</button><button>Next Chapter</button></awd-question-button-bar></div></awd-navigation-bar>';
    check('阅读、上一题、退出及章节导航不会享受例外',!debug.findAdvanceButton(null,{excludeChrome:true}));
    page.innerHTML='<header><awd-question-button-bar><button>Next Question</button></awd-question-button-bar></header>';
    check('孤立同名组件不扩大导航例外',!debug.findAdvanceButton(null,{excludeChrome:true}));

    page.innerHTML=fixture;debug.state.done.clear();clicks.length=0;
    const oldQuestion=D.collect()[0];
    page.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',()=>{
      page.querySelectorAll('.btn-confidence').forEach(btn=>{btn.disabled=false;});
    }));
    page.querySelector('[data-automation-id="confidence-buttons--medium_confidence"]').onclick=()=>{
      clicks.push('medium');
      check('进入反馈前答案已选齐',page.querySelectorAll('input:checked').length===3);
      renderFeedback();
    };
    await send('MCQ_START');await sleep(30);
    for(let i=0;i<100 && debug.state.running;i++)await sleep(100);
    check('一次启动完成 Medium → 反馈 → Next Question',clicks.join(',')==='medium,next');
    check('反馈页不再次询问模型',requests.length===1 && requests[0].hash===oldQuestion.hash);
    check('Next 后发现真正的新题',D.collect().length===1 && D.collect()[0].stem==='A new question reached through Next Question.');
    check('提交和反馈推进均不耗尽 pageTimeout',debug.state.stats.timeouts===0);
    check('原题完成记录保留',debug.state.done.has(oldQuestion.hash));
    check('正常结束且无答题失败',!debug.state.running && debug.state.stats.answered===1 && debug.state.stats.failed===0);
  }catch(error){check('无测试异常: '+error.stack,false);debug.state.running=false;}
  document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
  document.getElementById('out').textContent=JSON.stringify({checks,clicks,requests:requests.length,stats:debug.state.stats},null,2);
  window.__TEST_DONE__=true;
})();
</script></html>
