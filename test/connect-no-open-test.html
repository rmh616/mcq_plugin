<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Connect recognition without opening menus</title>
<link rel="stylesheet" href="../content/overlay.css"><style>iframe{width:900px;height:400px}.pass{color:green}.fail{color:red}</style>
<main class="worksheet__main"><p>What is the level of measurement for each of the following variables?</p><iframe class="external" title="Assessment Tool iFrame" src="./connect-sheet-fixture.html"></iframe></main>
<div id="verdict">Running</div><pre id="out"></pre>
<script>
const settings={apiKey:'fake',model:'test',baseUrl:'https://api.example.invalid',useCache:false,mode:'highlight',actionDelay:0,maxRounds:1,concurrency:6};
const memory={},listeners=[],requests=[],targets=['Interval','Ratio','Nominal','Nominal','Ordinal','Ratio'];
let backgroundListener,scriptReads=0,dataReads=0,clicks=0,forbiddenReads=0;
const sender={tab:{id:7},frameId:0,documentId:'outer-document',url:location.href};
const storage={async get(key){return key==='mcqSettings'?{mcqSettings:settings}:{[key]:memory[key]};},async set(data){Object.assign(memory,data);},async remove(key){delete memory[key];}};
window.chrome={storage:{local:storage,session:storage},runtime:{onInstalled:{addListener(){}},onMessage:{addListener(fn){if(!backgroundListener)backgroundListener=fn;else listeners.push(fn);}},sendMessage(msg,cb){
  const claimed=backgroundListener(msg,sender,result=>{if(cb)cb(result);});
  if(!claimed&&cb)cb({ok:true});
}},tabs:{onRemoved:{addListener(){}},async sendMessage(_tab,msg){listeners.forEach(fn=>fn(msg,{},()=>{}));}},scripting:{async executeScript(config){
 if(config.world!=='MAIN'||config.target.documentIds?.[0]!=='outer-document')throw new Error('Wrong execution world/document');
 scriptReads++;return [{result:config.func(...config.args)}];
}}};
const nativeFetch=window.fetch.bind(window);
window.fetch=async(url,options)=>{
 if(!String(url).endsWith('/chat/completions'))return nativeFetch(url,options);
 const request=JSON.parse(options.body);requests.push(request);
 const prompt=request.messages[1].content,index=prompt.match(/Match ONLY this row: ([a-f])\./)[1].charCodeAt(0)-97;
 const answer=prompt.match(new RegExp('([A-Z])\\. '+targets[index]+'(?:\\n|$)'))?.[1];
 return {ok:true,json:async()=>({choices:[{message:{content:JSON.stringify({answers:answer?[answer]:[],confidence:0.95})}}]})};
};
const send=type=>new Promise(resolve=>listeners[0]({type},{},resolve));
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
</script><script src="../background.js"></script><script src="../content/detector.js"></script><script src="../content/solver.js"></script><script>
window.addEventListener('load',async()=>{
 const checks=[],check=(name,ok)=>checks.push([name,!!ok]),D=__MCQ_DETECTOR__,debug=__MCQ_DEBUG__,frame=document.querySelector('iframe'),doc=frame.contentDocument;
 try{
  doc.querySelector('.listContainer').remove();
  const cells=Array.from(doc.querySelectorAll('td.responseCell')),data=new WeakMap();
  for(const cell of cells)data.set(cell,['','Ratio','<b>Interval</b>','Ordinal ','Nominal']);
  doc.addEventListener('click',()=>clicks++);doc.addEventListener('mousedown',()=>clicks++);
  doc.body.insertAdjacentHTML('beforeend','<input class="toolstate" type="hidden" value="PRIVATE_SOLUTION_STATE">');
  Object.defineProperty(frame.contentWindow,'actInstance',{configurable:true,get(){forbiddenReads++;throw new Error('Do not read hidden state');}});
  const jq=cell=>({data(key){dataReads++;if(key!=='dropdown'||arguments.length!==1)throw new Error('Only readonly dropdown data is allowed');return data.get(cell);}});
  frame.contentWindow.jQuery=jq;
  check('菜单从未生成时最初没有DOM候选',!doc.querySelector('.listContainer')&&D.collect().every(q=>q.incomplete));
  const scan=await send('MCQ_SCAN'),qs=D.collect();
  check('无需展开菜单即可扫描六个完整配对项',scan.count===6&&qs.length===6&&qs.every(q=>!q.incomplete));
  check('候选来自页面dropdown数据并转换HTML文字',qs.every(q=>q.options.map(o=>o.text).join('|')==='Interval|Nominal|Ordinal|Ratio'));
  check('空占位项被排除',qs.every(q=>q.options.length===4));
  check('MAIN读取在原文档执行且只读dropdown键',scriptReads===1&&dataReads===6&&forbiddenReads===0);
  check('扫描不点击、不改变焦点与值',clicks===0&&cells.every(cell=>D.connectCellText(cell)==='')&&doc.activeElement===doc.body);
  check('没有生成菜单或留下桥接标记',!doc.querySelector('.listContainer')&&!frame.hasAttribute('data-mas-connect-target'));
  check('扫描不调用模型',requests.length===0);
  await send('MCQ_START');await sleep(30);for(let i=0;i<100&&debug.state.running;i++)await sleep(50);
  check('高亮模式可直接按六行求解',requests.length===6&&debug.state.stats.answered===6);
  check('六行建议正确且未展开任何下拉框',cells.every((cell,i)=>cell.querySelector('.__mas_select_hint')?.textContent==='建议：'+targets[i])&&clicks===0&&!doc.querySelector('.listContainer'));
  check('隐藏工具状态及解答未被读取或发送',forbiddenReads===0&&requests.every(request=>!JSON.stringify(request).includes('PRIVATE_SOLUTION_STATE')));
  const key=type=>document.dispatchEvent(new KeyboardEvent(type,{key:'p',code:'KeyP',ctrlKey:true,altKey:true,bubbles:true}));
  key('keydown');await sleep(60);key('keyup');
  check('快捷键复用答案且始终不点击菜单',requests.length===6&&clicks===0&&cells.every(cell=>D.connectCellText(cell)===''));
  await send('MCQ_SCAN');
  const old=D.collect().map(q=>q.hash);
  data.set(cells[5],['Nominal','Ratio']);await send('MCQ_SCAN');
  check('相同dropdownid仍按每个控件的真实数据读取',D.collect()[5].options.length===2&&D.collect().slice(0,5).every(q=>q.options.length===4));
  check('候选变化只改变对应行hash',D.collect()[5].hash!==old[5]&&D.collect().slice(0,5).every((q,i)=>q.hash===old[i]));
  data.set(cells[0],['','Ratio','Ratio']);await send('MCQ_SCAN');
  check('重复候选文字标记不完整',D.collect()[0].incomplete&&D.collect()[0].issues.some(issue=>issue.includes('重复')));
  data.set(cells[0],[{solution:'PRIVATE_SOLUTION_STATE'}]);await send('MCQ_SCAN');
  check('非字符串候选不猜测或读取对象内部数据',D.collect()[0].incomplete&&forbiddenReads===0&&clicks===0);
  frame.contentWindow.jQuery=undefined;await send('MCQ_SCAN');
  check('组件尚未初始化时提示稍后重试而非要求点击',D.collect().every(q=>q.incomplete&&q.issues.some(issue=>issue.includes('稍后重新扫描')))&&clicks===0);

  // Screenshot-derived a/b layout: independent tools share the same cell IDs.
  frame.contentWindow.jQuery=jq;
  Array.from(doc.querySelectorAll('table.jSheet tbody tr')).slice(1).forEach(row=>row.remove());
  doc.querySelector('td.rowHeader').textContent='The ranking of wearable technologies would most likely be based on a';
  data.set(cells[0],['','population','sample']);
  const second=document.createElement('iframe');second.className='external';second.title='Assessment Tool iFrame';second.src='./connect-sheet-fixture.html';
  const loaded=new Promise((resolve,reject)=>{second.onload=resolve;second.onerror=reject;});frame.after(second);await loaded;
  const doc2=second.contentDocument;doc2.querySelector('.listContainer').remove();
  Array.from(doc2.querySelectorAll('table.jSheet tbody tr')).slice(1).forEach(row=>row.remove());
  doc2.querySelector('td.rowHeader').textContent='The ratings are based on a';
  doc2.addEventListener('click',()=>clicks++);doc2.addEventListener('mousedown',()=>clicks++);
  second.contentWindow.jQuery=()=>({data(key){if(key!=='dropdown')throw new Error('Unexpected state access');return ['','sample','population'];}});
  document.querySelector('.worksheet__main > p').textContent='The Fitbit Charge 6 Fitness Tracker monitors activities. Required: a. Would its ranking be based on a population or sample? b. Would 14,000 purchaser ratings be based on a population or sample?';
  await send('MCQ_SCAN');const separate=D.collect();
  check('截图a/b两块独立iframe无需展开即可识别',separate.length===2&&separate.every(q=>!q.incomplete&&q.options.map(o=>o.text).join('|')==='population|sample'));
  check('相同单元格ID不会导致a/b行或候选串位',separate[0].answerCell.ownerDocument===doc&&separate[1].answerCell.ownerDocument===doc2&&separate[0].hash!==separate[1].hash);
  check('保留共同情境及各自ranking或ratings描述',separate.every(q=>q.stem.includes('Fitbit Charge 6')&&q.stem.includes('14,000'))&&separate[0].stem.endsWith('ranking of wearable technologies would most likely be based on a')&&separate[1].stem.endsWith('The ratings are based on a'));
  check('多块控件扫描全过程仍无点击或写入',clicks===0&&separate.every(q=>D.connectCellText(q.answerCell)===''));
 }catch(error){check('无测试异常: '+error.stack,false);debug.state.running=false;}
 document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
 document.getElementById('out').textContent=JSON.stringify({checks,scriptReads,dataReads,clicks,modelCalls:requests.length},null,2);
 window.__TEST_DONE__=true;
});
</script></html>
