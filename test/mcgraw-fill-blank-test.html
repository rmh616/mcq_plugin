<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>McGraw Hill fill in the blank</title>
<link rel="stylesheet" href="../content/overlay.css">
<style>
body{font:14px/1.5 sans-serif;margin:24px} awd-probe,awd-navigation-bar,awd-question-button-bar,awd-confidence-buttons{display:block}
._visuallyHidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .pass{color:green}.fail{color:red}
</style>
<div id="verdict">Running</div><pre id="out"></pre><main id="page"></main>
<script>
const listeners=[],requests=[],events=[],settings={apiKey:'fake',mode:'select',actionDelay:5,submitDelay:5,pageTimeout:1800,maxRounds:1};
let reply=['mode'],submits=0,nextClicks=0,onSolve=null,controlledSets=0;
window.chrome={storage:{local:{get:async()=>({mcqSettings:settings})}},runtime:{onMessage:{addListener:fn=>listeners.push(fn)},sendMessage(msg,cb){
  let result={ok:true};
  if(msg.type==='MCQ_SOLVE'){
    requests.push(msg.payload);result={ok:true,values:reply,confidence:0.95,reason:'local text stub'};
    if(onSolve){const fn=onSolve;onSolve=null;return fn(result,cb);}
  }
  if(msg.type==='MAS_HIGHLIGHTS_SET')listeners.forEach(fn=>fn({type:'MAS_HIGHLIGHTS',payload:msg.payload},{},()=>{}));
  if(cb)cb(result);return Promise.resolve(result);
}}};
const send=type=>new Promise(resolve=>listeners[0]({type},{},resolve));
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const key=type=>document.dispatchEvent(new KeyboardEvent(type,{code:'KeyP',key:'p',ctrlKey:true,altKey:true,bubbles:true}));
async function run(){await send('MCQ_START');await sleep(30);for(let i=0;i<120&&__MCQ_DEBUG__.state.running;i++)await sleep(100);}
</script><script src="../content/detector.js"></script><script src="../content/solver.js"></script><script>
(async()=>{
 const checks=[],check=(name,ok)=>checks.push([name,!!ok]),D=__MCQ_DETECTOR__,debug=__MCQ_DEBUG__,page=document.getElementById('page');
 try{
  const fixture=await(await fetch('./mcgraw-fill-blank-fixture.html')).text();
  const input=()=>page.querySelector('input.fitb-input');
  const render=()=>{page.innerHTML=fixture;reply=['mode'];debug.state.done.clear();};
  const multi=()=>{
    render();const original=input().cloneNode();
    const prompt=page.querySelector('.fitb-fieldset .prompt');prompt.textContent='The [example] average is ';
    for(let i=1;i<=2;i++){
      const field=original.cloneNode();field.id='blank-'+i;field.name='blank-'+i;field.setAttribute('aria-label','Field '+i+' of 2');
      prompt.append(field,document.createTextNode(i===1?' and the middle value is ':'.'));
    }
  };
  render();
  const q=D.collect()[0],hash=q.hash;
  check('实际附件识别为一道单空文本题',D.collect().length===1&&q.type==='text'&&q.answerInputs.length===1);
  check('题干保留空位所在位置',q.stem==='The [Blank 1] of a set of data is the value or values that occur most often.');
  check('识别原始输入框及50字符限制',q.answerInputs[0]===input()&&q.blanks[0].maxLength===50);
  check('不伪造选择题候选',q.options.length===0&&!q.incomplete);
  page.insertAdjacentHTML('beforeend','<input type="text" id="search"><input type="password"><textarea></textarea>');
  check('不识别网页其它文本输入',D.collect().length===1);
  await send('MCQ_SCAN');
  const shadow=document.getElementById('__mcq_panel_host').shadowRoot;
  check('扫描显示填空类型和空位数',shadow.querySelector('.pick').textContent==='填空'&&shadow.querySelector('.why').textContent.includes('1 个空'));
  check('扫描标记实际输入框且不写入',input().classList.contains('__mcq_scan')&&input().value==='');
  input().value='old answer';check('填写内容不改变题目hash',D.collect()[0].hash===hash);
  input().readOnly=true;
  check('只读字段可扫描但不进入作答队列',D.collect().length===0&&D.collect(document,{includeReadOnly:true})[0].readOnly);
  const beforeReview=requests.length;await run();check('只读题不请求模型',requests.length===beforeReview);

  render();const field=input(),native=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  Object.defineProperty(field,'value',{get(){return native.get.call(this);},set(value){controlledSets++;native.set.call(this,value);}});
  field.addEventListener('input',()=>events.push('input'));field.addEventListener('change',()=>events.push('change'));
  await run();
  check('填入实际附件正确单词mode',field.value==='mode');
  check('原生setter触发input和change',controlledSets===0&&events.join(',')==='input,change');
  check('请求使用文本协议及空位元数据',requests.at(-1).type==='text'&&requests.at(-1).blankCount===1&&requests.at(-1).blanks[0].maxLength===50&&requests.at(-1).options.length===0);
  check('请求不含旧答案或插件建议',requests.at(-1).stem===q.stem&&D.collect()[0].hash===hash);
  check('仅填写模式不提交',submits===0&&page.querySelectorAll('.btn-confidence').length===3);
  check('建议以文本形式显示在字段旁',field.nextElementSibling.textContent==='建议：mode');

  render();settings.mode='highlight';await run();
  check('高亮模式不改动输入值',input().value===''&&input().classList.contains('__mcq_pick'));
  let hint=page.querySelector('.__mas_select_hint');check('高亮建议默认隐藏',getComputedStyle(hint).display==='none');
  key('keydown');await sleep(30);hint=page.querySelector('.__mas_select_hint');check('按住快捷键显示填空答案',getComputedStyle(hint).display!=='none'&&hint.textContent==='建议：mode');
  key('keyup');await sleep(10);check('松开快捷键隐藏建议且不填写',getComputedStyle(hint).display==='none'&&input().value==='');
  check('高亮建议不混入重复扫描题干',D.collect()[0].stem===q.stem&&D.collect()[0].hash===hash);
  await send('MCQ_SCAN');

  multi();reply=['arithmetic mean','median'];settings.mode='select';await run();
  check('同题两个空位都被识别并编号',requests.at(-1).blankCount===2&&requests.at(-1).stem.includes('[Blank 1]')&&requests.at(-1).stem.includes('[Blank 2]'));
  check('多空按DOM顺序填写完整短语',[...page.querySelectorAll('input.fitb-input')].map(el=>el.value).join('|')==='arithmetic mean|median');
  const multiHash=D.collect()[0].hash;
  check('多空建议不改变hash',multiHash===requests.at(-1).hash);

  for(const [name,values]of [['空回复',[]],['空字符串',[' ']],['非字符串',[0]],['多余答案',['mode','mean']],['超长答案',['x'.repeat(51)]]]){
    render();reply=values;settings.mode='submit';page.querySelectorAll('.btn-confidence').forEach(el=>el.onclick=()=>submits++);await run();
    check(name+'不会填写或提交',input().value===''&&submits===0&&debug.state.stats.failed===1);
  }
  multi();reply=['mean'];await run();check('少一空的回复阻止整题填写',[...page.querySelectorAll('input.fitb-input')].every(el=>el.value==='')&&submits===0);
  render();input().pattern='[0-9]+';reply=['mode'];await run();check('输入pattern限制失败阻止填写和提交',input().value===''&&submits===0);
  render();input().addEventListener('input',()=>{input().value='';});await run();check('站点拒绝写入时不提交',input().value===''&&submits===0);
  render();settings.submitDelay=250;
  input().addEventListener('input',()=>{setTimeout(()=>{input().value='';},150);});
  page.querySelectorAll('.btn-confidence').forEach(el=>{el.disabled=false;el.onclick=()=>submits++;});
  await run();check('提交等待期间字段被清空也阻止提交',input().value===''&&submits===0);
  settings.submitDelay=5;

  render();onSolve=(result,cb)=>{setTimeout(()=>{
    page.querySelector('.prompt').firstElementChild.firstChild.textContent='A different question ';
    cb(result);
  },50);};await run();check('模型等待期间换题不会写入旧答案',input().value===''&&submits===0&&debug.state.stats.failed===1);
  render();const oldInput=input();onSolve=(result,cb)=>{setTimeout(()=>{oldInput.replaceWith(oldInput.cloneNode());cb(result);},50);};await run();
  check('同题替换控件时不写入已脱离的旧框',input().value===''&&oldInput.value===''&&submits===0);
  render();onSolve=(result,cb)=>{setTimeout(()=>{document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true}));cb(result);},50);};await run();
  check('Esc取消等待中的填写',input().value===''&&submits===0);

  render();settings.mode='submit';
  page.querySelector('.fitb-fieldset').addEventListener('input',()=>{
    page.querySelectorAll('.btn-confidence').forEach(el=>{el.disabled=!input().value;});
  });
  page.querySelector('[data-automation-id="confidence-buttons--medium_confidence"]').onclick=()=>{
    check('提交前填写结果为mode',input().value==='mode');submits++;
    input().disabled=true;
    page.querySelectorAll('.btn-confidence').forEach(el=>{el.disabled=true;});
    setTimeout(()=>{
      page.querySelector('.confidence-buttons-container').remove();
      page.querySelector('awd-question-button-bar .navigation-row').insertAdjacentHTML('afterbegin','<button id="next">Next Question</button>');
      page.querySelector('#next').onclick=()=>{
        nextClicks++;page.innerHTML='<fieldset><p>A new question after the fill in the blank feedback.</p><label><input type="radio" name="new">Yes</label><label><input type="radio" name="new">No</label></fieldset>';
      };
    },300);
  };
  await run();
  check('填写后经Medium和反馈Next连续推进',submits===1&&nextClicks===1&&D.collect()[0]?.type==='single');
  check('禁用的反馈填空不误判为测验已结束',debug.state.stats.timeouts===0&&debug.state.stats.answered===1);
 }catch(error){check('无测试异常: '+error.stack,false);debug.state.running=false;}
 document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
 document.getElementById('out').textContent=JSON.stringify({checks,requests:requests.length,submits,nextClicks,stats:debug.state.stats},null,2);
 window.__TEST_DONE__=true;
})();
</script></html>
