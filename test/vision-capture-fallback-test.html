<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Protected graph capture fallback</title>
<style>
body{font:12px sans-serif;margin:0}label{display:block}
awd-probe,avalon-probe-renderer,avalon-image-renderer,awd-navigation-bar,awd-confidence-buttons{display:block}
.prompt-image{width:240px;height:auto}._visuallyHidden{display:none}
#verdict,#out{position:fixed;right:0;top:0;max-width:300px;pointer-events:none}.pass{color:green}.fail{color:red}
</style>
<div id="verdict">Running</div><pre id="out"></pre><main id="page"></main>
<iframe id="source" src="./mcgraw-vision-fixture.html" style="display:none"></iframe>
<script>
const settings={apiKey:'fake',model:'test',baseUrl:'https://api.example.invalid',mode:'select',actionDelay:5,submitDelay:5,maxRounds:1,useCache:false};
const listeners=[],messages=[],modelRequests=[],values={};
let captureCalls=0,imageFetches=0,active=true,changedTab=false,captureError=false,moveDuringCapture=false,cancelDuringCapture=false,modelReject=false,captureGraph=null;
const sender={tab:{id:7,windowId:1},frameId:0,documentId:'test-document',url:location.href};
const nativeFetch=window.fetch.bind(window), nativeDataURL=HTMLCanvasElement.prototype.toDataURL;
const storage={async get(key){return key==='mcqSettings'?{mcqSettings:settings}:{[key]:values[key]};},async set(data){Object.assign(values,data);},async remove(){}};
window.chrome={
 storage:{local:storage,session:storage},
 runtime:{onInstalled:{addListener(){}},onMessage:{addListener:fn=>listeners.push(fn)},sendMessage(msg,cb){
   messages.push(msg);
   let returned=false;
   for(const fn of listeners)if(fn(msg,sender,result=>{if(cb)cb(result);})===true){returned=true;break;}
   if(!returned&&cb)cb({ok:true});
 }},
 scripting:{async executeScript(config){return [{result:config.func(...config.args)}];}},
 tabs:{onRemoved:{addListener(){}},async get(){return {id:7,windowId:1,active,url:changedTab?'https://elsewhere.example':location.href};},async captureVisibleTab(){
   captureCalls++;if(captureError)throw new Error('permission denied');
   if(cancelDuringCapture)document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true}));
   if(moveDuringCapture)captureGraph.style.marginLeft='3px';
   const canvas=document.createElement('canvas');canvas.width=innerWidth*2;canvas.height=innerHeight*2;
   const ctx=canvas.getContext('2d');ctx.fillStyle='#ff00ff';ctx.fillRect(0,0,canvas.width,canvas.height);
   const r=captureGraph.getBoundingClientRect();ctx.fillStyle='#00ff00';ctx.fillRect(r.x*2,r.y*2,r.width*2,r.height*2);
   return nativeDataURL.call(canvas,'image/png');
 }}
};
window.fetch=async(url,options)=>{
 if(String(url).startsWith('https://protected.example/')){imageFetches++;return new Response('Forbidden',{status:403});}
 if(String(url).endsWith('/chat/completions')){
   modelRequests.push(JSON.parse(options.body));
   return {ok:true,json:async()=>({choices:[{message:{content:modelReject?'{"answers":[],"reason":"Cannot read graph"}':'{"answers":["B"],"confidence":0.95}'}}]})};
 }
 return nativeFetch(url,options);
};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const send=(msg,who=sender)=>new Promise(resolve=>{
 for(const fn of listeners)if(fn(msg,who,resolve)===true)break;
});
</script>
<script src="../background.js"></script><script src="../content/detector.js"></script><script src="../content/vision.js"></script><script src="../content/solver.js"></script>
<script>
window.addEventListener('load',async()=>{
 const checks=[],check=(name,ok)=>checks.push([name,!!ok]),page=document.getElementById('page'),D=__MCQ_DETECTOR__;
 try{
   const frame=document.getElementById('source');page.append(...Array.from(frame.contentDocument.body.childNodes));frame.remove();
   const graph=captureGraph=page.querySelector('.prompt-image');
   if(!graph.complete||!graph.naturalWidth)await new Promise((resolve,reject)=>{graph.onload=resolve;graph.onerror=reject;});
   // Simulate a rendered cross-origin graph: canvas is tainted and both fetches get 403.
   Object.defineProperty(graph,'currentSrc',{configurable:true,get:()=> 'https://protected.example/cumulative-frequency.jpg'});
   HTMLCanvasElement.prototype.toDataURL=function(){throw new DOMException('Tainted canvas','SecurityError');};
   const q=D.collect()[0];
   await new Promise(resolve=>listeners.at(-1)({type:'MCQ_START'},sender,resolve));
   await sleep(30);for(let i=0;i<100&&__MCQ_DEBUG__.state.running;i++)await sleep(100);
   check('原图两次403后成功选择模型答案',imageFetches===2&&q.options[1].input.checked);
   check('只在读取失败后捕获一次',captureCalls===1&&messages.filter(m=>m.type==='MAS_CAPTURE_IMAGE').length===1);
   check('失败的原图请求没有调用模型',modelRequests.length===1);
   const content=modelRequests[0]?.messages[1].content;
   const sent=content?.find(part=>part.type==='image_url')?.image_url.url;
   check('模型仅收到PNG图像字节',sent?.startsWith('data:image/png;base64,')&&content.filter(part=>part.type==='image_url').length===1);
   if(sent){
     const bitmap=await createImageBitmap(await(await nativeFetch(sent)).blob());
     const r=graph.getBoundingClientRect();
     check('裁剪按截图2倍像素比例计算',bitmap.width<=Math.round(r.width*2)&&bitmap.width>=Math.round(r.width*2)-1&&bitmap.height<=Math.round(r.height*2)&&bitmap.height>=Math.round(r.height*2)-1);
     const canvas=new OffscreenCanvas(bitmap.width,bitmap.height),ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);
     const pixels=ctx.getImageData(0,0,bitmap.width,bitmap.height).data;
     check('发送的裁剪没有题图外的紫色页面像素',Array.from({length:pixels.length/4},(_,i)=>i*4).every(i=>pixels[i]===0&&pixels[i+1]===255&&pixels[i+2]===0));
     bitmap.close();
   }
   check('截图令牌用完立即清理',!graph.hasAttribute('data-mas-capture-target'));
   check('图片标签和原题干保留',content?.some(part=>part.text==='Question image')&&content?.[0].text.includes(q.stem));

   const direct=async(overrides={},who=sender)=>{
     window.scrollTo(0,0);
     graph.setAttribute('data-mas-capture-target','direct-test');
     try{return await send({type:'MAS_CAPTURE_IMAGE',payload:{token:'direct-test',source:graph.currentSrc,hash:D.collect()[0].hash,...overrides}},who);}
     finally{graph.removeAttribute('data-mas-capture-target');}
   };
   let before=captureCalls;
   let result=await direct({hash:'wrong-hash'});
   check('换题或hash不匹配时不截图',!result.ok&&result.error.includes('题目已变化')&&captureCalls===before);
   result=await direct({source:'https://wrong.example/image'});
   check('源图片变化时不截图',!result.ok&&captureCalls===before);
   active=false;result=await direct();active=true;
   check('后台标签页不截图',!result.ok&&result.error.includes('标签页')&&captureCalls===before);
   result=await direct({}, {...sender,frameId:2});
   check('iframe不误用顶层坐标截图',!result.ok&&result.error.includes('顶层')&&captureCalls===before);
   graph.style.transform='translateY(10000px)';result=await direct();graph.style.transform='';
   check('题图未完整可见时不截残图',!result.ok&&result.error.includes('完整题图')&&captureCalls===before);
   const cover=document.createElement('div'),r=graph.getBoundingClientRect();
   Object.assign(cover.style,{position:'fixed',left:r.x+'px',top:r.y+'px',width:r.width+'px',height:r.height+'px',background:'white',zIndex:2147483647});page.append(cover);
   result=await direct();cover.remove();
   check('题图被遮挡时不截图',!result.ok&&result.error.includes('遮挡')&&captureCalls===before);
   moveDuringCapture=true;result=await direct();moveDuringCapture=false;graph.style.marginLeft='';
   check('截图期间位置变化时不返回图像',!result.ok&&!result.dataUrl&&result.error.includes('发生变化'));
   captureError=true;result=await direct();captureError=false;
   check('无截图权限时提供重新启动提示',!result.ok&&!result.dataUrl&&result.error.includes('点击插件图标'));
   check('失败的截图不调用模型',modelRequests.length===1);
   q.options.forEach(option=>{option.input.checked=false;});window.scrollTo(0,0);
   // Use a new resource so this scenario exercises cancellation during capture,
   // rather than successfully reusing the earlier verified crop.
   Object.defineProperty(graph,'currentSrc',{configurable:true,get:()=> 'https://protected.example/cumulative-frequency-cancel.jpg'});
   cancelDuringCapture=true;
   await new Promise(resolve=>listeners.at(-1)({type:'MCQ_START'},sender,resolve));
   await sleep(30);for(let i=0;i<100&&__MCQ_DEBUG__.state.running;i++)await sleep(100);
   // Esc stops the public flow before crop encoding finishes; wait for cleanup.
   for(let i=0;i<100&&graph.hasAttribute('data-mas-capture-target');i++)await sleep(20);
   cancelDuringCapture=false;
   check('截图期间Esc阻止后续模型请求与选择',modelRequests.length===1&&page.querySelectorAll('input:checked').length===0&&!graph.hasAttribute('data-mas-capture-target'));
   HTMLCanvasElement.prototype.toDataURL=nativeDataURL;modelReject=true;
   before=captureCalls;
   await new Promise(resolve=>listeners.at(-1)({type:'MCQ_START'},sender,resolve));
   await sleep(30);for(let i=0;i<100&&__MCQ_DEBUG__.state.running;i++)await sleep(100);
   check('模型拒答不触发额外截图重试',modelRequests.length===2&&captureCalls===before&&page.querySelectorAll('input:checked').length===0);
 }catch(error){check('无测试异常: '+error.stack,false);__MCQ_DEBUG__.state.running=false;}
 finally{HTMLCanvasElement.prototype.toDataURL=nativeDataURL;window.fetch=nativeFetch;}
 document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
 document.getElementById('out').textContent=JSON.stringify({checks,captureCalls,imageFetches,modelCalls:modelRequests.length},null,2);
 window.__TEST_DONE__=true;
});
</script></html>
