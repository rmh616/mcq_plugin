<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Connect SPA Next waits for new iframe controls</title>
<style>iframe{width:800px;height:220px}.pass{color:green}.fail{color:red}</style>
<main class="worksheet__main"><p id="stem">In a marketing study, 100 consumers selected their favorite mattress type: foam, latex, hybrid, or inner spring. How many classes should the frequency table have?</p><iframe class="external" title="Assessment Tool iFrame" src="./connect-classes-fixture.html?item=15"></iframe></main>
<footer><span class="footer__progress__heading__current-question">15</span><button class="footer__link--next">Next</button></footer>
<div id="verdict">Running</div><pre id="out"></pre>
<script>
const listeners=[],requests=[],saved=[],atNext=[],settings={apiKey:'fake',mode:'submit',actionDelay:5,submitDelay:5,pageTimeout:1000,maxRounds:2,concurrency:1};
let phase=15,nextClicks=0,scenario='normal',wireReady=false;
const frame=document.querySelector('iframe'),button=document.querySelector('button.footer__link--next'),stem=document.getElementById('stem');
window.chrome={storage:{local:{get:async()=>({mcqSettings:settings})}},runtime:{onMessage:{addListener:fn=>listeners.push(fn)},sendMessage(msg,cb){
 let result={ok:true};
 if(msg.type==='MCQ_SOLVE'){requests.push({phase,ready:wireReady,payload:msg.payload});result={ok:true,value:msg.payload.stem.includes('38 observations')?'6':'4',confidence:0.95};}
 if(msg.type==='MCQ_CONNECT_CHOICES')result={ok:true,frames:[]};
 if(cb)cb(result);return Promise.resolve(result);
}}};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const send=type=>new Promise(resolve=>listeners[0]({type},{},resolve));
function wire(){
 const doc=frame.contentDocument,cell=doc.querySelector('td.responseCell');wireReady=true;
 doc.getElementById('loading_image').style.display='none';
 cell.onmousedown=()=>cell.classList.add('jSheetCellActive');
 cell.ondblclick=()=>{
  const editor=doc.createElement('textarea');editor.className='jSheetInPlaceEdit';doc.body.append(editor);
  editor.onkeydown=event=>{if(event.keyCode===13){cell.textContent=editor.value;saved.push({phase,value:editor.value});editor.remove();}};
 };
}
button.onclick=()=>{
 nextClicks++;atNext.push(saved.map(item=>({...item})));
 if(scenario==='normal'){
  if(phase===15){
   phase=16;wireReady=false;stem.textContent='A set of data consists of 38 observations. How many classes would you recommend for the frequency distribution?';
   document.querySelector('.footer__progress__heading__current-question').textContent='16';
   setTimeout(()=>history.replaceState(null,'','#question-16'),40);
   // Next stays the same node; the old filled iframe remains for a while.
   setTimeout(()=>{
    frame.onload=()=>{
     frame.contentDocument.getElementById('loading_image').style.display='block';
     setTimeout(wire,300);
    };
    frame.src='./connect-classes-fixture.html?item=16';
   },600);
  }else{
   phase=17;frame.contentDocument.querySelector('#jQuerySheet').remove();
   document.querySelector('.worksheet__main').insertAdjacentHTML('afterbegin','<fieldset><p>A new question after the two Classes exercises.</p><label><input type="radio" name="new">Yes</label><label><input type="radio" name="new">No</label></fieldset>');
  }
 }else if(scenario==='url-only')history.replaceState(null,'','#loading-without-new-controls');
 else if(scenario==='in-place'){
  stem.textContent='A set of data consists of 38 observations. How many classes would you recommend?';
  setTimeout(()=>{frame.contentDocument.querySelector('td.responseCell').textContent='';},250);
 }else if(scenario==='duplicate'){
  frame.onload=wire;frame.src='./connect-classes-fixture.html?item=duplicate';
 }else if(scenario==='cancel')setTimeout(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true})),150);
};
</script><script src="../content/detector.js"></script><script src="../content/solver.js"></script><script>
window.addEventListener('load',async()=>{
 const checks=[],check=(name,ok)=>checks.push([name,!!ok]),debug=__MCQ_DEBUG__,D=__MCQ_DETECTOR__;
 try{
  wire();const originalButton=button;
  await send('MCQ_START');await sleep(30);for(let i=0;i<300&&debug.state.running;i++)await sleep(50);
  check('一次开始连续完成15题与16题',saved.map(item=>item.phase+':'+item.value).join('|')==='15:4|16:6');
  check('两题各只求解一次',requests.length===2&&requests[0].phase===15&&requests[1].phase===16);
  check('新题请求等待iframe控件初始化完成',requests.every(request=>request.ready));
  check('新题没有混入上一题题干',requests[1]?.payload.stem.includes('38 observations')&&!requests[1]?.payload.stem.includes('mattress'));
  check('同一个Next节点每题只点一次',button===originalButton&&nextClicks===2);
  check('第二次Next前已完成16题保存',atNext[1]?.some(item=>item.phase===16&&item.value==='6'));
  check('地址先变和iframe延迟不会报无反应或超时',debug.state.stats.answered===2&&debug.state.stats.failed===0&&debug.state.stats.timeouts===0);
  check('连续推进后发现下一道题',D.collect()[0]?.stem==='A new question after the two Classes exercises.');

  document.querySelector('.worksheet__main fieldset').remove();
  const reset=async()=>{
   frame.onload=null;
   await new Promise(resolve=>{frame.onload=resolve;frame.src='./connect-classes-fixture.html?reset='+Math.random();});
   wire();frame.contentDocument.querySelector('td.responseCell').textContent='4';
   stem.textContent='A frequency table with four mattress types. How many classes?';
   debug.state.done.clear();D.collect().forEach(q=>debug.state.done.add(q.hash));debug.state.running=true;debug.state.settings.pageTimeout=500;debug.state.stats.timeouts=0;
  };
  await reset();scenario='url-only';let before=nextClicks;
  let result=await debug.advance(null);debug.state.running=false;
  check('只有URL变化时不会再次点击Next跳题',!result.ok&&nextClicks===before+1&&result.reason.includes('下一题'));
  check('未就绪超时给出加载提示而非按钮无反应',!result.reason.includes('没有反应')&&result.reason.includes('尚未就绪'));

  await reset();scenario='no-change';before=nextClicks;
  result=await debug.advance(null);debug.state.running=false;
  check('页面真正不变时只尝试一次并明确停止',!result.ok&&nextClicks===before+1&&result.reason.includes('未检测到题目变化'));

  await reset();scenario='in-place';const doc=frame.contentDocument,cell=doc.querySelector('td.responseCell');before=nextClicks;
  result=await debug.advance(null);debug.state.running=false;
  check('原位复用同一文档和单元格时等待字段重置',result.ok&&result.questions[0].answerNumberCell===cell&&frame.contentDocument===doc&&D.connectCellText(cell)==='');
  check('原位更新不会反复点击同一个Next',nextClicks===before+1);

  await reset();scenario='duplicate';const oldHash=D.collect()[0].hash;before=nextClicks;
  result=await debug.advance(null);debug.state.running=false;
  check('文字相同的新iframe题目不被旧hash跳过',result.ok&&result.questions[0].hash===oldHash&&!debug.state.done.has(oldHash)&&debug.pendingQuestions().length===1);
  check('相同文字新题也只导航一次',nextClicks===before+1);

  await reset();scenario='cancel';before=nextClicks;
  result=await debug.advance(null);
  check('等待加载期间Esc立即取消且不再点击',result.cancelled&&!debug.state.running&&nextClicks===before+1);
  check('等待和取消本身不会调用模型填写旧题',requests.length===2);
 }catch(error){check('无测试异常: '+error.stack,false);debug.state.running=false;}
 document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
 document.getElementById('out').textContent=JSON.stringify({checks,nextClicks,saved,requests:requests.map(request=>({phase:request.phase,ready:request.ready,stem:request.payload.stem}))},null,2);
 window.__TEST_DONE__=true;
});
</script></html>
