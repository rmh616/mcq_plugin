<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Canvas review hold-to-highlight</title>
<link rel="stylesheet" href="../content/overlay.css">
<style>body{font:14px/1.5 sans-serif;margin:24px}label{display:block;margin:8px}.question{margin:15px;padding:12px;border:1px solid #ddd}.pass{color:green}.fail{color:red}</style>
<div id="verdict">运行中…</div><pre id="out"></pre><div id="page"></div>
<script>
const listeners=[],requests=[],messages=[],settings={apiKey:'',mode:'submit',concurrency:3};
window.chrome={storage:{local:{get:async()=>({mcqSettings:settings})}},runtime:{onMessage:{addListener:fn=>listeners.push(fn)},sendMessage(msg,cb){
 messages.push(msg.type);let reply={ok:true};
 if(msg.type==='MCQ_SESSION_GET')reply={session:null};
 if(msg.type==='MCQ_SOLVE'){requests.push(msg.payload);reply={ok:false,error:'Review should not call a model'}}
 if(msg.type==='MAS_HIGHLIGHTS_SET')for(const fn of listeners)fn({type:'MAS_HIGHLIGHTS',payload:msg.payload},{},()=>{});
 if(cb)cb(reply);return Promise.resolve(reply);
}}};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function key(type){document.dispatchEvent(new KeyboardEvent(type,{key:'p',code:'KeyP',ctrlKey:true,altKey:true,bubbles:true,cancelable:true}))}
const shown=el=>getComputedStyle(el).outlineStyle==='solid'&&getComputedStyle(el).outlineWidth==='3px';
const hiddenPanel=()=>!document.getElementById('__mcq_panel_host')||getComputedStyle(document.getElementById('__mcq_panel_host')).display==='none';
</script><script src="../content/detector.js"></script><script src="../content/solver.js"></script><script>
(async()=>{
 const checks=[],check=(name,ok)=>checks.push([name,!!ok]),page=document.getElementById('page'),D=__MCQ_DETECTOR__;
 try{
  page.innerHTML=await(await fetch('./canvas-market-review-fixture.html')).text();
  const review=D.collect(document,{includeReadOnly:true}),snapshot=[...page.querySelectorAll('input')].map(input=>({checked:input.checked,disabled:input.disabled}));
  check('真实Practice Quiz 2附件识别全部10题',review.length===10);
  check('10题均只读，仍不进入原自动作答队列',review.every(q=>q.readOnly)&&__MCQ_DEBUG__.pendingQuestions().length===0);
  check('40个字母选项映射成完整文字',review.every(q=>q.options.length===4&&q.options.every(o=>o.text.length>1)));
  check('按键前没有高亮或悬浮窗口',!page.querySelector('.__mcq_pick')&&hiddenPanel());
  key('keydown');await sleep(30);
  const marked=()=>[...page.querySelectorAll('.__mcq_pick')];
  check('无需开始按钮，按住后10题都有答案标记',marked().length===10&&__MCQ_DEBUG__.highlightStatus.answered===10);
  check('每个标记均来自Canvas公开的correct_answer行',marked().every(el=>el.closest('.answer').classList.contains('correct_answer')));
  check('截图第4题正确标记D',review[3].options.find(o=>o.clickTarget.classList.contains('__mcq_pick')).letter==='D');
  check('绿色框在按住时实际可见',marked().every(shown));
  check('即使没有API Key也不调用模型',requests.length===0&&__MCQ_DEBUG__.highlightStatus.error==='');
  check('保留所有原始选中及禁用状态',snapshot.every((s,i)=>{const input=page.querySelectorAll('input')[i];return input.checked===s.checked&&input.disabled===s.disabled}));
  check('不创建自动翻页会话',!messages.includes('MCQ_SESSION_BEGIN')&&!__MCQ_DEBUG__.state.running);
  check('求解后页面窗口继续隐藏',hiddenPanel());
  key('keyup');check('松开后10个答案框全部立即隐藏',marked().every(el=>!shown(el)));
  key('keydown');await sleep(30);check('再次按住可直接显示且仍不调用模型',marked().every(shown)&&requests.length===0);key('keyup');
  const first=review[0],a=first.options[0],d=first.options[3];
  first.options.forEach(o=>{o.input.checked=false;o.clickTarget.classList.remove('__mcq_pick');o.clickTarget.closest('.answer').classList.remove('selected_answer')});
  a.input.checked=true;a.clickTarget.closest('.answer').classList.add('selected_answer');
  key('keydown');await sleep(30);
  check('选错A时仍高亮公开正确D，不把已选当正确答案',d.clickTarget.classList.contains('__mcq_pick')&&!a.clickTarget.classList.contains('__mcq_pick'));
  check('高亮不会把错误作答改成正确作答',a.input.checked&&!d.input.checked);key('keyup');
  first.options.forEach(o=>{o.clickTarget.classList.remove('__mcq_pick');o.clickTarget.closest('.answer').classList.remove('correct_answer')});
  key('keydown');await sleep(30);check('未公开正确答案的只读题保持未标记且不问模型',!first.container.querySelector('.__mcq_pick')&&requests.length===0);key('keyup');
  const multi=review[1].container.cloneNode(true);multi.id='question_multi_review';multi.classList.replace('multiple_choice_question','multiple_answers_question');
  multi.querySelector('.question_text').append(' Multiple answers review.');
  [...multi.querySelectorAll('input')].forEach((input,i)=>{input.id='multi-review-'+i;input.name='multi-review';input.type='checkbox';input.checked=i===3;const label=input.parentElement.querySelector('label');label.htmlFor=input.id;label.classList.remove('__mcq_pick');const row=input.closest('.answer');row.classList.toggle('correct_answer',i===0||i===2)});
  page.appendChild(multi);const mq=D.collect(document,{includeReadOnly:true}).find(q=>q.container===multi);
  check('可扫描只读多选回顾题',mq&&mq.type==='multi'&&mq.readOnly);
  key('keydown');await sleep(30);
  check('只读多选题只高亮公开正确A/C',mq.options.filter(o=>o.clickTarget.classList.contains('__mcq_pick')).map(o=>o.letter).join('')==='AC');
  check('多选高亮保留用户原选D且不调用模型',mq.options[3].input.checked&&!mq.options[0].input.checked&&requests.length===0);key('keyup');
 }catch(error){check('无测试异常: '+error.stack,false)}
 document.getElementById('verdict').innerHTML=checks.map(([name,ok])=>'<div class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>').join('');
 document.getElementById('out').textContent=JSON.stringify({checks,apiCalls:requests.length,messages},null,2);window.__TEST_DONE__=true;
})();
</script></html>
